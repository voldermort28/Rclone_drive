<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDrive Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header>
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/>
                </svg>
                <h1>GDriveDL</h1>
            </div>
            <p class="subtitle">Premium Google Drive Downloader</p>
        </header>

        <section class="card input-section">
            <div class="input-group">
                <label for="url">Google Drive URL</label>
                <input type="text" id="url" placeholder="Paste file or folder link here..." autocomplete="off">
            </div>

            <div class="input-group">
                <label for="output_dir">Output Directory (Optional)</label>
                <input type="text" id="output_dir" placeholder="Default: ./downloads">
            </div>

            <button id="downloadBtn" class="btn-primary">
                <span class="btn-text">Start Download</span>
            </button>
        </section>

        <section class="card status-section" id="statusSection" style="display: none;">
            <div class="status-header">
                <h3 id="statusText">Downloading...</h3>
                <span id="fileText" class="file-name"></span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="progress-info">
                    <span id="progressPercent">0%</span>
                    <span id="sizeInfo"></span>
                </div>
            </div>

            <div class="logs-container">
                <div class="logs-header">
                    <span>Logs</span>
                    <button class="clear-logs" onclick="clearLogs()">Clear</button>
                </div>
                <div class="logs-content" id="logsContent">
                    <!-- Logs will appear here -->
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
