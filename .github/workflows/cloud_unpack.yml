name: Cloud Unpack & Merge

on:
  repository_dispatch:
    types: [cloud_unpack]

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          echo "=== Disk space before clean ==="
          df -h
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/graalvm || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/chrome-driver || true
          sudo rm -rf /usr/local/share/chromedriver-linux64 || true
          sudo rm -rf /usr/local/share/gecko-driver || true
          sudo rm -rf /usr/local/share/selenium || true
          sudo rm -rf /etc/mysql || true
          sudo rm -rf /var/lib/mysql || true
          sudo systemctl stop docker || true
          sudo rm -rf /var/lib/docker || true
          sudo rm -rf /etc/docker || true
          sudo docker system prune --all --volumes --force || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          echo "=== Disk space after clean ==="
          df -h


      - name: Install Rclone & Extraction Tools
        run: |
          echo "=== Installing Gclone ==="
          curl -L -o gclone.zip https://github.com/dogbutcat/gclone/releases/download/v1.71.0-mod1.6.2/gclone-v1.71.0-mod1.6.2-linux-amd64.zip
          unzip gclone.zip
          GCLONE_BIN=$(find . -name "gclone" -type f)
          chmod +x "$GCLONE_BIN"
          sudo mv "$GCLONE_BIN" /usr/bin/rclone
          rm -rf gclone.zip gclone-v*
          echo "=== Installing 7-Zip, Unrar & FUSE ==="
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update
          sudo -E apt-get install p7zip-full unrar fuse3 -y
          # Tạo symlink cho fusermount nếu thiếu (gclone cũ yêu cầu fusermount thay vì fusermount3)
          if ! command -v fusermount >/dev/null 2>&1 && command -v fusermount3 >/dev/null 2>&1; then
            echo "Creating symlink for fusermount"
            sudo ln -s $(which fusermount3) /usr/bin/fusermount
          fi

      - name: Setup Rclone Configuration
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ github.event.client_payload.rclone_conf }}" | base64 --decode > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download, Unpack and Upload
        run: |
          set -e
          
          # Inputs
          REMOTE_PATH="${{ github.event.client_payload.remote_path }}"
          MODE="${{ github.event.client_payload.mode }}"
          PASSWORD="${{ github.event.client_payload.password }}"
          
          echo "=== Inputs ==="
          echo "Remote Path: $REMOTE_PATH"
          echo "Mode: $MODE"
          if [ -n "$PASSWORD" ]; then
            echo "Password: [PROTECTED]"
          else
            echo "Password: None"
          fi
          
          # 1. Determine target directory and normalize remote path
          if [[ "$REMOTE_PATH" =~ ^([^:]+):(.*)$ ]]; then
            REMOTE_NAME="${BASH_REMATCH[1]}"
            PATH_PART="${BASH_REMATCH[2]}"
            HAS_REMOTE=true
          else
            REMOTE_NAME="gc"
            PATH_PART="$REMOTE_PATH"
            HAS_REMOTE=true
          fi

          PATH_PART="${PATH_PART%/}"

          if [[ "$PATH_PART" =~ ^([A-Za-z0-9_-]{15,})(/.*)?$ ]]; then
            FOLDER_ID="${BASH_REMATCH[1]}"
            SUBPATH="${BASH_REMATCH[2]}"
            if [[ ! "$FOLDER_ID" =~ ^\{.*\}$ ]]; then
              PATH_PART="{${FOLDER_ID}}${SUBPATH}"
            fi
          fi

          if [ "$HAS_REMOTE" = "true" ]; then
            CLEANED_PATH="${REMOTE_NAME}:${PATH_PART}"
          else
            CLEANED_PATH="${PATH_PART}"
          fi

          if [ -z "$PATH_PART" ]; then
            PARENT_PATH="$CLEANED_PATH"
            BASENAME=""
          else
            DIR_PART=$(dirname "$PATH_PART")
            BASE_PART=$(basename "$PATH_PART")
            if [ "$DIR_PART" = "." ]; then
              if [ "$HAS_REMOTE" = "true" ]; then
                PARENT_PATH="${REMOTE_NAME}:"
              else
                PARENT_PATH="."
              fi
            else
              if [ "$HAS_REMOTE" = "true" ]; then
                PARENT_PATH="${REMOTE_NAME}:${DIR_PART}"
              else
                PARENT_PATH="${DIR_PART}"
              fi
            fi
            BASENAME="$BASE_PART"
          fi

          echo "Cleaned Path: $CLEANED_PATH"
          echo "Parent Path: $PARENT_PATH"
          echo "Basename: $BASENAME"

          IS_FOLDER=false
          if [[ "$REMOTE_PATH" == */ ]] || rclone lsd "$CLEANED_PATH" >/dev/null 2>&1; then
            IS_FOLDER=true
          fi
          echo "Is Folder: $IS_FOLDER"

          # 2. Setup mount point and mount Google Drive
          MNT_DIR="/home/runner/mnt"
          mkdir -p "$MNT_DIR"
          
          echo "=== Mounting Parent Path: $PARENT_PATH ==="
          sudo modprobe fuse || true
          rclone mount "$PARENT_PATH" "$MNT_DIR" --vfs-cache-mode writes --rc > /home/runner/rclone.log 2>&1 &
          RCLONE_PID=$!
          
          # Wait for mount to be ready
          echo "=== Waiting for mount to be ready ==="
          MOUNTED=false
          for i in {1..20}; do
            if mountpoint -q "$MNT_DIR"; then
              echo "Mount successful!"
              MOUNTED=true
              break
            fi
            if ! kill -0 $RCLONE_PID 2>/dev/null; then
              echo "Error: Rclone mount process died immediately!"
              cat /home/runner/rclone.log
              exit 1
            fi
            sleep 1
          done
          
          if [ "$MOUNTED" = "false" ]; then
            echo "Error: Failed to mount $PARENT_PATH to $MNT_DIR (Timeout)"
            cat /home/runner/rclone.log
            exit 1
          fi

          # 3. Processing and Extraction
          echo "=== Processing Extraction ==="
          P_ARG="-p-"
          if [ -n "$PASSWORD" ]; then
            P_ARG="-p$PASSWORD"
          fi

          if [ "$IS_FOLDER" = "true" ]; then
            echo "=== Processing folder extraction ==="
            TARGET_DIR="$MNT_DIR/$BASENAME"
            cd "$TARGET_DIR"
            
            # Find split zip/rar/7z files (.001 format) to extract
            SPLIT_FILES=$(find . -maxdepth 2 -name "*.001" | sort)
            for f in $SPLIT_FILES; do
              echo "Extracting split archive: $f"
              7z x "$f" "$P_ARG" -o"$TARGET_DIR" -y < /dev/null
            done
            
            # Find split WinRAR files (.part1.rar) to extract
            PART_RAR_FILES=$(find . -maxdepth 2 -regextype posix-extended -iregex '.*part0*1\.rar' | sort)
            for f in $PART_RAR_FILES; do
              echo "Extracting multipart RAR: $f"
              7z x "$f" "$P_ARG" -o"$TARGET_DIR" -y < /dev/null
            done
            
            # Find standard archives (.zip, .rar, .7z)
            STANDARD_ARCHIVES=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.rar" -o -name "*.7z" \) | sort)
            for f in $STANDARD_ARCHIVES; do
              # Skip split rar parts (e.g. part2, part02)
              if [[ "$f" =~ [pP]art[0-9]+ ]]; then
                if [[ ! "$f" =~ [pP]art0*1\.rar ]]; then
                  echo "Skipping split part: $f"
                  continue
                fi
              fi
              # Skip split parts (.001, .002)
              if [[ "$f" =~ \.[0-9]+$ ]]; then
                continue
              fi
              echo "Extracting standard archive: $f"
              7z x "$f" "$P_ARG" -o"$TARGET_DIR" -y < /dev/null
            done
          else
            echo "=== Processing single file extraction ==="
            TARGET_FILE="$BASENAME"
            
            # Normalize split archive to the first part
            if [[ "$BASENAME" =~ ^(.*)\.(zip|rar|7z)\.[0-9]+$ ]]; then
              PREFIX="${BASENAME%.*}"
              TARGET_FILE="${PREFIX}.001"
              echo "Normalized split archive to: $TARGET_FILE"
            elif [[ "$BASENAME" =~ ^(.*)\.part[0-9]+\.rar$ ]]; then
              PREFIX=$(echo "$BASENAME" | sed -E 's/\.part[0-9]+\.rar//I')
              if [ -f "$MNT_DIR/${PREFIX}.part01.rar" ]; then
                TARGET_FILE="${PREFIX}.part01.rar"
              else
                TARGET_FILE="${PREFIX}.part1.rar"
              fi
              echo "Normalized multipart RAR to: $TARGET_FILE"
            elif [[ "$BASENAME" =~ ^(.*)\.r[0-9]+$ ]]; then
              PREFIX=$(echo "$BASENAME" | sed -E 's/\.r[0-9]+$//I')
              TARGET_FILE="${PREFIX}.rar"
              echo "Normalized old multipart RAR to: $TARGET_FILE"
            fi

            echo "Extracting target file: $TARGET_FILE"
            7z x "$MNT_DIR/$TARGET_FILE" "$P_ARG" -o"$MNT_DIR" -y < /dev/null
          fi
          
          echo "=== Extraction completed ==="
          
          # 4. Wait for background uploads to complete
          echo "=== Waiting for background uploads to complete ==="
          while true; do
            STATS=$(rclone rc vfs/stats 2>/dev/null || echo "")
            if [ -z "$STATS" ]; then
              echo "RC API not responding, checking cache directory..."
              CACHE_FILES=$(find ~/.cache/rclone/vfs -type f 2>/dev/null | wc -l || echo "0")
              if [ "$CACHE_FILES" -eq 0 ]; then
                echo "VFS cache is empty."
                break
              fi
              echo "VFS cache contains $CACHE_FILES files. Waiting 10s..."
            else
              IN_PROGRESS=$(echo "$STATS" | grep -o '"uploadsInProgress": [0-9]*' | awk '{print $2}' || echo "0")
              QUEUED=$(echo "$STATS" | grep -o '"uploadsQueued": [0-9]*' | awk '{print $2}' || echo "0")
              echo "Active uploads: $IN_PROGRESS | Queued uploads: $QUEUED"
              if [ "$IN_PROGRESS" = "0" ] && [ "$QUEUED" = "0" ]; then
                echo "All background uploads are complete!"
                break
              fi
            fi
            sleep 10
          done
          
          echo "=== Unmounting ==="
          sudo umount -f "$MNT_DIR" || true
          echo "=== Completed successfully ==="
