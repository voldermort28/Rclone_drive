name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "rclone_web_ui/*"
          target: "/www/wwwroot/rclone.laboon.vn/"
          strip_components: 1

      - name: Post-deployment Restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /www/wwwroot/rclone.laboon.vn/
            echo "Current directory files:"
            ls -F
            # Restart app
            pkill -f 'python3 app.py' || true
            sleep 2
            nohup python3 app.py > /tmp/gdrivedl.log 2>&1 &
            echo "Deployment finished and app restarted."

