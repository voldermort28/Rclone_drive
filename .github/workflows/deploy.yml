name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "rclone_web_ui/*"
          target: "/www/wwwroot/rclone.laboon.vn/"
          strip_components: 1

      - name: Post-deployment Restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /www/wwwroot/rclone.laboon.vn/
            # Kill existing app safely (avoid killing this session)
            PID=$(pgrep -f "python3 app.py" | grep -v "$$" || true)
            if [ -n "$PID" ]; then
              echo "Killing existing process: $PID"
              kill -9 $PID || true
            fi
            sleep 2
            # Start app and detach
            nohup python3 app.py > /tmp/gdrivedl.log 2>&1 &
            sleep 2
            echo "Deployment finished. App should be running in background."

